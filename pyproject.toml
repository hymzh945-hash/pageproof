[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pageproof"
version = "0.1.0"
description = "Find what bounces at the printer before you send it: mixed page sizes, text in the trim, scanned pages, low-DPI images."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "PageProof" }]
keywords = ["pdf", "prepress", "print", "audit", "pdfplumber", "dpi", "bleed", "document"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Office Suites",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pageproof = "pageproof.cli:main"

[tool.setuptools.packages.find]
include = ["pageproof*"]

[tool.setuptools.package-data]
"pageproof.data" = ["*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
